<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Protección de sesión inmediata -->
    <script src="js/auth-guard.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Barsac² - Mis Prendas</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <link href="css/custom-theme.css" rel="stylesheet">

    <style>
        body {
            background: #1a1f2b;
        }

        .prendas-wrapper {
            min-height: 100vh;
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .prendas-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .prendas-vacio {
            color: #aab2c5;
            text-align: center;
            margin-top: 80px;
        }
    </style>
</head>

<body id="page-top">

    <!-- Pantalla de la modista. Por ahora solo el ingreso: el listado de prendas
         asignadas llega cuando esté la asignación por renglón de las fichas. -->
    <div class="prendas-wrapper">
        <div class="prendas-topbar">
            <span class="text-light font-weight-bold" id="lblNombreUsuario"></span>
            <a href="#" id="btnLogout" class="text-light"><i class="fas fa-sign-out-alt"></i> Salir</a>
        </div>

        <h1 class="text-light h3 mb-3">Mis Prendas</h1>

        <div class="prendas-vacio">
            <i class="fas fa-tshirt fa-3x mb-3"></i>
            <p>Todavía no tenés prendas asignadas.</p>
            <p class="small">Cuando te asignen trabajo lo vas a ver acá.</p>
        </div>
    </div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Protección de sesión inmediata -->
    <script src="js/auth-guard.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Barsac² - Mis Prendas</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <link href="css/custom-theme.css" rel="stylesheet">

    <style>
        body {
            background: #1a1f2b;
            color: #dfe3ea;
        }

        .prendas-wrapper {
            min-height: 100vh;
            max-width: 640px;
            margin: 0 auto;
            padding: 16px;
        }

        .prendas-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .prendas-vacio {
            color: #aab2c5;
            text-align: center;
            margin-top: 60px;
        }

        .ficha-card {
            background: #242b3a;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .ficha-card.terminada { opacity: .75; }

        .renglon {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 0 4px;
        }

        .renglon.completo .renglon-titulo { color: #5cd08a; }

        .contador {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Botones grandes para tocar cómodo con el dedo */
        .contador .btn {
            width: 48px;
            height: 48px;
            font-size: 1.3rem;
            border-radius: 10px;
        }

        .contador .valor {
            min-width: 84px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .seccion-titulo {
            color: #aab2c5;
            font-size: .9rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin: 28px 0 10px;
            cursor: pointer;
        }
    </style>
</head>

<body id="page-top">

    <div class="prendas-wrapper">
        <div class="prendas-topbar">
            <span class="text-light font-weight-bold" id="lblNombreUsuario"></span>
            <span>
                <a href="#" class="text-light mr-3" onclick="abrirCambioPassword(); return false;"><i class="fas fa-key"></i> Contraseña</a>
                <a href="#" id="btnLogout" class="text-light"><i class="fas fa-sign-out-alt"></i> Salir</a>
            </span>
        </div>

        <h1 class="text-light h3 mb-3">Mis Prendas</h1>

        <div id="listaPendientes"></div>

        <div class="seccion-titulo" data-toggle="collapse" data-target="#colapsoTerminadas" role="button" aria-expanded="false">
            <i class="fas fa-chevron-right mr-1"></i> Terminadas
        </div>
        <div class="collapse" id="colapsoTerminadas">
            <div id="listaTerminadas"></div>
        </div>
    </div>

    <!-- MODAL: CAMBIAR CONTRASEÑA -->
    <div class="modal fade" id="modalPassword" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content" style="background: #242b3a; color: #dfe3ea;">
                <div class="modal-header border-0">
                    <h5 class="modal-title font-weight-bold"><i class="fas fa-key mr-2"></i>Cambiar contraseña</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="passActual" class="font-weight-bold small">Contraseña actual</label>
                        <input type="password" id="passActual" class="form-control" autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="passNueva" class="font-weight-bold small">Contraseña nueva</label>
                        <input type="password" id="passNueva" class="form-control" minlength="6" autocomplete="new-password">
                        <small class="text-muted">Mínimo 6 caracteres.</small>
                    </div>
                    <div class="form-group mb-0">
                        <label for="passRepetir" class="font-weight-bold small">Repetí la contraseña nueva</label>
                        <input type="password" id="passRepetir" class="form-control" minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success px-4" onclick="guardarPassword()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: COSÍ DE MÁS -->
    <div class="modal fade" id="modalExtra" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content" style="background: #242b3a; color: #dfe3ea;">
                <div class="modal-header border-0">
                    <h5 class="modal-title font-weight-bold">Cosí de más — Ficha #<span id="extraFichaId"></span></h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted">Usalo solo si te llegaron más prendas de las que tenías asignadas. Lo revisan antes de sumarlo al pago.</p>

                    <div class="form-group">
                        <label for="extraProducto" class="font-weight-bold small">Producto</label>
                        <select id="extraProducto" class="form-control"></select>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold small">¿Cuántas de más?</label>
                        <div class="contador">
                            <button type="button" class="btn btn-outline-light" onclick="cambiarCantidadExtra(-1)"><i class="fas fa-minus"></i></button>
                            <div class="valor"><span id="extraCantidad">1</span></div>
                            <button type="button" class="btn btn-outline-light" onclick="cambiarCantidadExtra(1)"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>

                    <div class="form-group mb-0">
                        <label for="extraNota" class="font-weight-bold small">Nota (opcional)</label>
                        <input type="text" id="extraNota" class="form-control" placeholder="Ej: vinieron 2 remeras talle M de más">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success px-4" onclick="guardarExtra()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: IMAGEN DEL DISEÑO -->
    <div class="modal fade" id="modalZoomImagen" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
            <div class="modal-content bg-dark border-0">
                <button type="button" class="close text-white px-3 py-2" data-dismiss="modal" aria-label="Close" style="position: absolute; right: 0; top: 0; z-index: 10; opacity: .9;">
                    <span aria-hidden="true">&times;</span>
                </button>
                <img id="imgZoomGrande" src="" style="width: 100%; max-height: 85vh; object-fit: contain;">
            </div>
        </div>
    </div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/misPrendas.js"></script>
    <script src="js/app.js"></script>

</body>

</html>

<body id="page-top">

    <!-- Page Wrapper -->

        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html">
                <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-laugh-wink"></i></div>

            <hr class="sidebar-divider my-0">
            <hr class="sidebar-divider">
            <div class="sidebar-heading">Producción</div>
            <li class="nav-item"><a class="nav-link" href="diseno.html"><i class="fas fa-pencil-ruler"></i><span>Diseño</span></a></li>
            <li class="nav-item active"><a class="nav-link" href="corte.html"><i class="fas fa-cut"></i><span>Corte</span></a></li>
            <hr class="sidebar-divider d-none d-md-block">

            <div class="text-center d-none d-md-inline">
                <button class="rounded-circle border-0" id="sidebarToggle"></button>
            </div>
        </ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>
                    <ul class="navbar-nav ml-auto align-items-center">
                        <li class="nav-item">
                            <button id="themeToggle" class="btn btn-link rounded-circle mr-3 border-0" title="Cambiar Tema">
                                <i id="themeIcon" class="fas fa-moon text-gray-600 font-size-18"></i>
                            </button>
                        </li>
                        <div class="topbar-divider d-none d-sm-block"></div>
                        <li class="nav-item dropdown no-arrow">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <span class="mr-2 d-none d-lg-inline text-gray-600 small font-weight-bold" id="lblNombreUsuario">
                                    Usuario
                                </span>
                                <div class="img-profile rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                    <i class="fas fa-user"></i>
                                </div>
                            </a>
                            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                                <a class="dropdown-item" href="perfil.html">
                                    <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                                    Editar Perfil
                                </a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#" id="btnLogout">
                                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                                    Cerrar Sesión
                                </a>
                            </div>
                        </li>
                    </ul>
                </nav>
                <!-- End of Topbar -->

                <div class="container-fluid pt-2">
                    <h1 class="h3 mb-4 font-weight-bold">Corte</h1>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Fichas en Corte</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered table-sm text-center" id="tablaFichasCorte" width="100%">
                                    <thead>
                                        <tr>
                                            <th>N° Ficha</th>
                                            <th>N° Orden</th>
                                            <th class="text-left">Cliente</th>
                                            <th>Fecha Entrega</th>
                                            <th>Estado</th>
                                            <th style="width: 25%;">Progreso</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaFichasCorteBody">
                                        <!-- Se carga dinámicamente vía JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <!-- End of Main Content -->
            <footer class="sticky-footer">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- MODAL: TRABAJAR FICHA -->
    <div class="modal fade" id="modalFichaCorte" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header py-3">
                    <h5 class="modal-title font-weight-bold">
                        <i class="fas fa-cut text-primary mr-2"></i>
                        Ficha #<span id="ctFichaId"></span> — Orden #<span id="ctOrdenId"></span>
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body px-4 py-3">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <span class="font-weight-bold text-muted small">Cliente:</span>
                            <div id="ctCliente" class="font-weight-bold"></div>
                        </div>
                        <div class="col-md-6">
                            <span class="font-weight-bold text-muted small">Fecha Entrega:</span>
                            <div id="ctFechaEntrega" class="font-weight-bold"></div>
                        </div>
                    </div>

                    <div id="ctZonaImagen" class="mb-3"></div>

                    <hr>

                    <h6 class="font-weight-bold text-primary">Prendas</h6>
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm text-center align-middle">
                            <thead class="bg-white">
                                <tr>
                                    <th class="text-left">Producto</th>
                                    <th>Talle</th>
                                    <th>Nombre / Número</th>
                                    <th>Estado</th>
                                    <th style="width: 150px;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="ctPrendasBody">
                                <!-- Se carga dinámicamente vía JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-secondary btn-sm px-3" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: ZOOM DE IMAGEN -->
    <div class="modal fade" id="modalZoomImagen" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
            <div class="modal-content bg-dark border-0">
                <button type="button" class="close text-white px-3 py-2" data-dismiss="modal" aria-label="Close" style="position: absolute; right: 0; top: 0; z-index: 10; opacity: .9;">
                    <span aria-hidden="true">&times;</span>
                </button>
                <img id="imgZoomGrande" src="" style="width: 100%; max-height: 85vh; object-fit: contain;">
            </div>
        </div>
    </div>

    <!-- JS Scripts Base -->
    <script src="vendor/jquery/jquery.min.js"></script>
